name: BTC-ETH-BOT

# Runs the bot on GitHub's servers (scripts/actions-run.sh), for every coin in config.js COINS.
# The Mac runs the bot (cron, scripts/setup-mac.sh); since 2026-11-21 this workflow is its BACK-UP: the scheduled
# runs only go ahead when the Mac has been quiet for 45 minutes (scripts/backup-guard.js: its newest "Demo …"
# commit), so a sleeping or switched-off Mac doesn't stop the bot. ntfy says when GitHub takes over and when the
# Mac is back. GitHub starts scheduled runs late or skips them under load (this repo: the watchdog's half-hourly
# schedule ran about every 7 hours), so an outside timer can call "Run workflow" with action = auto every 15 minutes
# instead (README: Back-up timer): same guard, full run in minutes 0-14 and 30-44 of the hour, sync otherwise.
#   :07 and :37  full run: exits, trailing stop, new entries after a 4H close
#   :22 and :52  sync: books fills / stop-outs, real-price stop check
# Two full runs an hour so a late or skipped scheduled start (GitHub delays them under load) still enters inside
# the entry window (ENTRY_FRESH_MIN) after a 4H close. The safety stop lives on OKX and doesn't depend on these runs.
#
# Keys: repository Settings → Secrets and variables → Actions →
# OKX_API_KEY, OKX_API_SECRET, OKX_API_PASSPHRASE. Until they exist, runs
# only check the connection to OKX. "Run workflow" with action = check tests
# the keys without trading.
#
on:
  schedule:
    - cron: '7,37 * * * *'    # full run (only when the Mac is quiet)
    - cron: '22,52 * * * *'   # sync (only when the Mac is quiet)
  workflow_dispatch:
    inputs:
      action:
        description: 'auto = back-up (runs only when the Mac is quiet; full run in minutes 0-14 and 30-44, else sync), run = full run, sync = fills only, check = test OKX connection and keys (no trading), testtrade = open + close the smallest position (real demo order), parts = test two positions on one instrument (real demo orders, default BTC-USD_UM-261225)'
        type: choice
        options: [check, run, sync, auto, testtrade, probe, bills, parts]
        default: check
      instrument:
        description: 'testtrade / check only: another OKX instrument to try (e.g. BTC-USDC); empty = the coin''s own'
        type: string
        default: ''
      coin:
        description: 'testtrade only: which coin'
        type: choice
        options: [BTC, ETH, NEAR, UNI, HYPE]
        default: BTC

permissions:
  contents: write

# One run at a time, never cancelled halfway through an order.
concurrency:
  group: btc-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 400   # the back-up guard looks for the Mac's newest commit

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Scheduled runs: only when the Mac has been quiet for 45 minutes. Manual runs always go ahead.
      - name: Is the Mac running?
        id: guard
        if: github.event_name == 'schedule' || inputs.action == 'auto'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          node scripts/backup-guard.js
          if [ "$(grep -c '^changed=true' "$GITHUB_OUTPUT")" != 0 ] && grep -q '^go=false' "$GITHUB_OUTPUT"; then
            # the Mac is back: remember it (the bot itself doesn't run, so nothing else commits)
            git config user.name "btc-eth-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/backup.json && git commit -q -m "Back-up off: the Mac is back" && { git pull --rebase -q && git push -q; } || true
          fi

      - name: Run the bot
        if: (github.event_name != 'schedule' && inputs.action != 'auto') || steps.guard.outputs.go == 'true'
        env:
          EXCHANGE: okx
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          # The OKX site the account belongs to (keys only work there): EEA.
          OKX_API_BASE: ${{ secrets.OKX_API_BASE || vars.OKX_API_BASE || 'https://my.okx.com' }}
          # EEA account: no USDT, no perpetual swaps. The USD-settled BTC
          # future (perpetual-style, to 2031), margined in USDC, max 10x.
          OKX_INSTRUMENT: ${{ vars.OKX_INSTRUMENT || 'BTC-USD_UM_XPERP-310328' }}
          # ETH's equivalent (default ETH-USD_UM_XPERP-310328); the coins traded are config.js COINS.
          OKX_INSTRUMENT_ETH: ${{ vars.OKX_INSTRUMENT_ETH }}
          OKX_INSTRUMENT_NEAR: ${{ vars.OKX_INSTRUMENT_NEAR }}
          OKX_INSTRUMENT_UNI: ${{ vars.OKX_INSTRUMENT_UNI }}
          OKX_INSTRUMENT_HYPE: ${{ vars.OKX_INSTRUMENT_HYPE }}
          # Isolated margin, as set in the OKX app (each position's margin kept apart).
          OKX_MARGIN_MODE: ${{ vars.OKX_MARGIN_MODE || 'isolated' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TRADEBOT_HALT: ${{ vars.TRADEBOT_HALT }}
        run: |
          if [ "${{ inputs.action }}" = "auto" ]; then M=$(( 10#$(date -u +%M) % 30 )); [ "$M" -lt 15 ] && MODE=run || MODE=sync;
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.action }}";
          elif [ "${{ github.event.schedule }}" = "22,52 * * * *" ]; then MODE=sync;
          else MODE=run; fi
          echo "mode: $MODE"
          if [ -n "${{ inputs.instrument }}" ] && [ "$MODE" = check ]; then export OKX_INSTRUMENT="${{ inputs.instrument }}"; fi
          if [ "$MODE" = probe ] && [ -n "${{ inputs.instrument }}" ]; then export TESTTRADE_INSTRUMENT="${{ inputs.instrument }}"; fi
          if [ "$MODE" = parts ] && [ -n "${{ inputs.instrument }}" ]; then export TESTTRADE_INSTRUMENT="${{ inputs.instrument }}"; fi
          if [ "$MODE" = testtrade ]; then
            export COIN="${{ inputs.coin }}"
            [ -n "${{ inputs.instrument }}" ] && export TESTTRADE_INSTRUMENT="${{ inputs.instrument }}"
          fi
          bash scripts/actions-run.sh "$MODE"
