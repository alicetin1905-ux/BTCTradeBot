name: BTC bot

# Runs the bot on GitHub's servers — no Mac needed (scripts/actions-run.sh),
# for every coin in config.js COINS (BTC, ETH and HYPE).
#   :03 and :33  full run: exits, trailing stop, new entries after a 4H close
#   :18 and :48  sync: books fills / stop-outs for the dashboard
# Two full runs an hour so a late or skipped scheduled start (GitHub delays
# them under load) still entered inside the entry window (ENTRY_FRESH_MIN) after a
# 4H close. The stop itself lives on OKX and doesn't depend on these runs.
#
# Keys: repository Settings → Secrets and variables → Actions →
# OKX_API_KEY, OKX_API_SECRET, OKX_API_PASSPHRASE. Until they exist, runs
# only check the connection to OKX. "Run workflow" with action = check tests
# the keys without trading.
#
# Use this OR the Mac's cron (scripts/setup-mac.sh), not both. Right now the Mac runs the bot; this workflow is manual only.

on:
  # Scheduled runs are OFF since 2026-10-03: the bot runs from the Mac's cron (scripts/setup-mac.sh) because
  # GitHub skipped scheduled runs for hours. To go back to GitHub, restore these two lines and stop the Mac:
  #   schedule:
  #     - cron: '3,33 * * * *'    full run
  #     - cron: '18,48 * * * *'   sync
  workflow_dispatch:
    inputs:
      action:
        description: 'run = full run, sync = fills only, check = test OKX connection and keys (no trading), testtrade = open + close the smallest position (real demo order)'
        type: choice
        options: [check, run, sync, testtrade, probe]
        default: check
      instrument:
        description: 'testtrade / check only: another OKX instrument to try (e.g. BTC-USDC); empty = the coin''s own'
        type: string
        default: ''
      coin:
        description: 'testtrade only: which coin'
        type: choice
        options: [BTC, ETH, NEAR, UNI, HYPE]
        default: BTC

permissions:
  contents: write

# One run at a time, never cancelled halfway through an order.
concurrency:
  group: btc-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run the bot
        env:
          EXCHANGE: okx
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          # The OKX site the account belongs to (keys only work there): EEA.
          OKX_API_BASE: ${{ secrets.OKX_API_BASE || vars.OKX_API_BASE || 'https://my.okx.com' }}
          # EEA account: no USDT, no perpetual swaps. The USD-settled BTC
          # future (perpetual-style, to 2031), margined in USDC, max 10x.
          OKX_INSTRUMENT: ${{ vars.OKX_INSTRUMENT || 'BTC-USD_UM_XPERP-310328' }}
          # ETH's equivalent (default ETH-USD_UM_XPERP-310328); the coins traded are config.js COINS.
          OKX_INSTRUMENT_ETH: ${{ vars.OKX_INSTRUMENT_ETH }}
          OKX_INSTRUMENT_NEAR: ${{ vars.OKX_INSTRUMENT_NEAR }}
          OKX_INSTRUMENT_UNI: ${{ vars.OKX_INSTRUMENT_UNI }}
          OKX_INSTRUMENT_HYPE: ${{ vars.OKX_INSTRUMENT_HYPE }}
          # Isolated margin, as set in the OKX app (each position's margin kept apart).
          OKX_MARGIN_MODE: ${{ vars.OKX_MARGIN_MODE || 'isolated' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TRADEBOT_HALT: ${{ vars.TRADEBOT_HALT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.action }}";
          elif [ "${{ github.event.schedule }}" = "18,48 * * * *" ]; then MODE=sync;
          else MODE=run; fi
          echo "mode: $MODE"
          if [ -n "${{ inputs.instrument }}" ] && [ "$MODE" = check ]; then export OKX_INSTRUMENT="${{ inputs.instrument }}"; fi
          if [ "$MODE" = probe ] && [ -n "${{ inputs.instrument }}" ]; then export TESTTRADE_INSTRUMENT="${{ inputs.instrument }}"; fi
          if [ "$MODE" = testtrade ]; then
            export COIN="${{ inputs.coin }}"
            [ -n "${{ inputs.instrument }}" ] && export TESTTRADE_INSTRUMENT="${{ inputs.instrument }}"
          fi
          bash scripts/actions-run.sh "$MODE"
